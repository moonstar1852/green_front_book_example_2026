
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자바스크립트 실습</title>
</head>
<body>

    <h1>자바스크립트 첫 수업</h1>
    <p id="text">안녕하세요!</p>

    <button onclick="changeText()">클릭하세요</button>

    <script>
        function changeText() {
            document.getElementById("text").innerText
                = "버튼을 클릭했습니다!";
        }
    </script>

</body>
</html>
