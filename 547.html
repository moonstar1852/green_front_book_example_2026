<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좌석 배치도</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        table, td {
            border: 1px solid #ccc;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <script>
        const memNum = parseInt(prompt("입장객은 몇 명인가요?"));
        const colNum = parseInt(prompt("한 줄에 몇 명씩 앉나요?"));
        const rowNum = Math.ceil(memNum / colNum);   // 필요한 줄 수 (올림)

        document.write(`<table>`);
        for (let i = 0; i < rowNum; i++) {
            document.write(`<tr>`);
            for (let j = 1; j <= colNum; j++) {
                let seatNo = i * colNum + j;
                if (seatNo > memNum) break;
                document.write(`<td>좌석 ${seatNo}</td>`);
            }
            document.write(`</tr>`);
        }
        document.write(`</table>`);
    </script>
</body>
</html>
